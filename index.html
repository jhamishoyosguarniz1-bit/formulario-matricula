<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Matrícula</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .checkbox-group {
            margin-top: 15px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Formulario de Matrícula</h2>
    
    <!-- IMPORTANTE: netlify y name="contacto" activan el sistema de correos -->
    <form name="matricula" method="POST" data-netlify="true">
        
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="correo">Correo del participante:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" required>

        <label for="curso">Curso:</label>
        <input type="text" id="curso" name="curso" value="HTML y CSS" readonly>

        <label for="modalidad">Modalidad:</label>
        <select id="modalidad" name="modalidad">
            <option value="Virtual">Virtual</option>
            <option value="Presencial">Presencial</option>
        </select>

        <label for="mensaje">Mensaje o consulta:</label>
        <textarea id="mensaje" name="mensaje"></textarea>

        <div class="checkbox-group">
            <label>
                <input type="checkbox" name="condiciones" value="Aceptadas" required> Condiciones: Aceptadas
            </label>
        </div>

        <button type="submit">Enviar Solicitud</button>
    </form>
</div>

</body>
</html>
